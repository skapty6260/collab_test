<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="TEAM FIVE — галерея: фото с турниров, тренировок и буткемпов."
        />
        <title>TEAM FIVE — Gallery</title>
        <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="../styles/gallery.css" />
    </head>
    <body>
        <div class="topbar">
            <div class="topbar__left">
                <span class="topbar__status"></span>
                <span class="topbar__label">ROSTER ONLINE</span>
            </div>
            <div class="topbar__right">
                <span class="topbar__patch">PATCH 7.37</span>
                <span class="topbar__divider"></span>
                <span class="topbar__mmr">AVG MMR <strong>9 240</strong></span>
            </div>
        </div>

        <header class="header">
            <a href="../index.html" class="header__logo">
                <span class="header__mark">
                    <svg
                        viewBox="0 0 24 24"
                        width="26"
                        height="26"
                        fill="none"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M12 7 L16.5 9.5 V14.5 L12 17 L7.5 14.5 V9.5 Z"
                            fill="currentColor"
                            opacity=".55"
                        />
                    </svg>
                </span>
                <span class="header__title">TEAM<em>FIVE</em></span>
            </a>
            <nav class="header__nav" aria-label="Основная навигация">
                <a href="../index.html#roster" class="header__link">Состав</a>
                <a href="matches.html" class="header__link">Матчи</a>
                <a href="achievements.html" class="header__link">Достижения</a>
                <a href="gallery.html" class="header__link header__link--active"
                    >Галерея</a
                >
            </nav>
            <button
                class="theme-btn"
                id="themeBtn"
                type="button"
                aria-label="Сменить тему"
            >
                <span class="theme-btn__icon" id="themeIcon">🌙</span>
            </button>
        </header>

        <main class="gallery">
            <section class="page-hero">
                <p class="hero__eyebrow">
                    <span class="dot"></span> MEDIA · TEAM FIVE
                </p>
                <h1 class="page-hero__title">
                    Наша <span class="hero__accent">галерея</span>
                </h1>
                <p class="page-hero__text">
                    Кадры с турниров, буткемпов и командных тренировок.
                    Атмосфера состава.
                </p>
            </section>

            <!-- Сетка изображений -->
            <section class="grid" aria-label="Фотогалерея">
                <figure class="grid__item grid__item--wide">
                    <img
                        src="../img/gallery/team-photo.jpg"
                        alt="Командное фото TEAM FIVE"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Гранд-финал</span>
                        <span class="grid__meta"
                            >Студенческий кубок · 2025</span
                        >
                    </figcaption>
                </figure>
                <figure class="grid__item">
                    <img
                        src="../img/gallery/bootcamp.jpg"
                        alt="Буткемп команды"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Буткемп</span>
                        <span class="grid__meta">Перед квалификацией</span>
                    </figcaption>
                </figure>
                <figure class="grid__item">
                    <img
                        src="../img/gallery/setup.jpg"
                        alt="Игровые места"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Сетап</span>
                        <span class="grid__meta">Тренировочная база</span>
                    </figcaption>
                </figure>
                <figure class="grid__item grid__item--tall">
                    <img
                        src="../img/gallery/trophy.jpg"
                        alt="Кубок команды"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Кубок</span>
                        <span class="grid__meta">Победа в финале</span>
                    </figcaption>
                </figure>
                <figure class="grid__item">
                    <img
                        src="../img/gallery/draft.jpg"
                        alt="Драфт-сессия"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Драфт</span>
                        <span class="grid__meta">Разбор пиков</span>
                    </figcaption>
                </figure>
                <figure class="grid__item">
                    <img
                        src="../img/gallery/fans.jpg"
                        alt="Болельщики на турнире"
                        loading="lazy"
                    />
                    <figcaption class="grid__caption">
                        <span class="grid__title">Фан-зона</span>
                        <span class="grid__meta">Поддержка с трибун</span>
                    </figcaption>
                </figure>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">
                © <span id="footerYear">2026</span> TEAM FIVE · Dota 2 Roster ·
                Учебный проект
            </p>
        </footer>

        <script src="../index.js"></script>
    </body>
</html>
